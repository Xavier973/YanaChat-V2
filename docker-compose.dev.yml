version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MISTRAL_API_URL=${MISTRAL_API_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - REPORT_EMAIL=${REPORT_EMAIL}
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED}
      - WEB_SEARCH_SHOW=${WEB_SEARCH_SHOW}
      - PORT=8000
    volumes:
      - ./logs:/app/logs
      - ./app:/app/app
      - ./src:/app/src
      - ./config:/app/config
      - ./tests:/app/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - yanachat

  portfolio:
    image: python:3.11-slim
    container_name: yanachat_portfolio_dev
    ports:
      - "8001:8001"
    volumes:
      - ./portfolio:/srv/portfolio
    working_dir: /srv/portfolio
    command: python -m http.server 8001
    networks:
      - yanachat

networks:
  yanachat:
    driver: bridge
