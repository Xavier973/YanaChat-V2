<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YanaChat V2</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.40) 0%, rgba(118, 75, 162, 0.40) 100%),
                        url('/static/bg-image.webp') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 900px;
        }
        
        .header {
            background: linear-gradient(135deg, #02b63e 0%, #000000 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
            position: relative;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .header-actions {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        
        .clear-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            display: flex;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .user-message {
            justify-content: flex-end;
        }
        
        .user-message .text {
            background: #014d1a;
            color: white;
            border-radius: 12px 12px 0 12px;
        }
        
        .bot-message .text {
            background: #f0f0f0;
            color: #333;
            border-radius: 12px 12px 12px 0;
            max-width: 90%;
        }
        
        .text {
            padding: 12px 16px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.6;
            font-size: 14px;
        }
        
        /* Markdown styling */
        .text h1, .text h2, .text h3, .text h4 {
            margin-top: 12px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .text h1 { font-size: 18px; }
        .text h2 { font-size: 16px; }
        .text h3 { font-size: 15px; }
        .text h4 { font-size: 14px; }
        
        .text ul, .text ol {
            margin-left: 20px;
            margin-top: 8px;
            margin-bottom: 8px;
        }
        
        .text li {
            margin-bottom: 4px;
        }
        
        .text p {
            margin-bottom: 8px;
        }
        
        .text code {
            background: rgba(0, 0, 0, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        
        .text strong {
            font-weight: 600;
        }
        
        .text em {
            font-style: italic;
        }
        
        .input-container {
            border-top: 1px solid #eee;
            padding: 20px;
            display: flex;
            gap: 10px;
        }
        
        input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        input:focus {
            border-color: #667eea;
        }
        
        button {
            background: #02b63e;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #014d1a;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            margin: 0 2px;
        }
        
        .loading:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .loading:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }
        
        /* Scrollbar styling */
        .chat-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .chat-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        .chat-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }
        
        .chat-container::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
        
        /* Footer styling */
        .footer {
            background: rgba(0, 0, 0, 0.05);
            padding: 15px;
            border-radius: 0 0 12px 12px;
            text-align: center;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
        }
        
        .footer-links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            font-weight: 500;
        }
        
        .footer-links a:hover {
            color: #02b63e;
            transform: scale(1.05);
        }
        
        .footer-links a::before {
            font-size: 18px;
        }
        
        .footer-text {
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }
        
        .footer-text:hover {
            color: #02b63e;
            text-decoration: underline;
        }
        
        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.3s;
        }
        
        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s;
            position: relative;
        }
        
        .modal-header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .modal-header h2 {
            color: #02b63e;
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .modal-header p {
            color: #666;
            font-size: 14px;
        }
        
        .modal-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .modal-links a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .modal-links a:hover {
            background: #02b63e;
            color: white;
            transform: translateX(5px);
        }
        
        .modal-links a span {
            font-size: 24px;
        }
        
        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 28px;
            color: #999;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .close-modal:hover {
            color: #02b63e;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-actions">
                <button class="clear-btn" onclick="clearConversation()">🔄 Nouvelle conversation</button>
            </div>
            <h1>YanaChat</h1>
            <p>IA au service de la Guyane</p>
        </div>
        
        <div class="chat-container" id="chatContainer"></div>
        
        <div class="input-container">
            <input 
                type="text" 
                id="queryInput" 
                placeholder="Posez votre question..."
                autocomplete="off"
            >
            <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #666;">
                <input type="checkbox" id="webSearchCheckbox" style="width: auto;">
                Recherche web
            </label>
            <button id="sendBtn" onclick="sendMessage()">Envoyer</button>
        </div>
        
        <div class="footer">
            <div class="footer-links">
                <p style="font-size: 14px; color: #666;">© 2026 YanaChat</p>
                <span class="footer-text" onclick="openModal()">À propos - Contact</span>
            </div>
        </div>
    </div>
    
    <!-- Modal -->
    <div id="contactModal" class="modal" onclick="closeModalOnOutside(event)">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div class="modal-header">
                <p>Développé par Xavier Cuniberti</p>
            </div>
            <div class="modal-links">
                <a href="https://www.linkedin.com/in/xavier-cuniberti-528aa84b/" target="_blank" rel="noopener noreferrer">
                    <span>💼</span> LinkedIn
                </a>
                <a href="https://github.com/Xavier973/YanaChat-V2" target="_blank" rel="noopener noreferrer">
                    <span>🐙</span> GitHub
                </a>
                <a href="mailto:x.cuniberti@gmail.com">
                    <span>✉️</span> Mail
                </a>
            </div>
        </div>
    </div>
    
    <script>
        const chatContainer = document.getElementById('chatContainer');
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');
        const sessionId = generateSessionId();
        
        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        function addMessage(text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + (isUser ? 'user-message' : 'bot-message');
            
            const textDiv = document.createElement('div');
            textDiv.className = 'text';
            
            if (isUser) {
                // User messages: plain text
                textDiv.textContent = text;
            } else {
                // Bot messages: parse Markdown
                textDiv.innerHTML = marked.parse(text);
            }
            
            messageDiv.appendChild(textDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function showLoading() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot-message';
            messageDiv.id = 'loading-message';
            
            const textDiv = document.createElement('div');
            textDiv.className = 'text';
            
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.className = 'loading';
                textDiv.appendChild(dot);
            }
            
            messageDiv.appendChild(textDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function removeLoading() {
            const loading = document.getElementById('loading-message');
            if (loading) loading.remove();
        }
        
        async function sendMessage() {
            const query = queryInput.value.trim();
            const webSearch = document.getElementById('webSearchCheckbox').checked;
            
            if (!query) return;
            
            // Disable input
            queryInput.disabled = true;
            sendBtn.disabled = true;
            
            // Add user message
            addMessage(query, true);
            queryInput.value = '';
            
            // Show loading
            showLoading();
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        session_id: sessionId,
                        web_search: webSearch
                    })
                });
                
                removeLoading();
                
                if (response.ok) {
                    const data = await response.json();
                    addMessage(data.response, false);
                } else {
                    addMessage('Erreur: ' + response.statusText, false);
                }
            } catch (error) {
                removeLoading();
                addMessage('Erreur de connexion: ' + error.message, false);
            } finally {
                queryInput.disabled = false;
                sendBtn.disabled = false;
                queryInput.focus();
            }
        }
        
        // Send message on Enter key
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Clear conversation
        async function clearConversation() {
            if (!confirm('Effacer l\'historique de cette conversation ?')) {
                return;
            }
            
            try {
                const response = await fetch('/api/clear_history', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        session_id: sessionId
                    })
                });
                
                if (response.ok) {
                    // Clear UI
                    chatContainer.innerHTML = '';
                    addMessage('Nouvelle conversation démarrée. Je ne me souviens plus de nos échanges précédents.', false);
                } else {
                    alert('Erreur lors de l\'effacement de l\'historique');
                }
            } catch (error) {
                alert('Erreur: ' + error.message);
            }
        }
        
        // Focus input on load
        queryInput.focus();
        
        // Modal functions
        function openModal() {
            document.getElementById('contactModal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('contactModal').classList.remove('active');
        }
        
        function closeModalOnOutside(event) {
            if (event.target.id === 'contactModal') {
                closeModal();
            }
        }
        
        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
